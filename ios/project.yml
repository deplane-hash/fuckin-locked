name: FuckinLocked
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_FLGatewayURL: "$(FL_GATEWAY_URL)"
    INFOPLIST_KEY_FLTURNHost: "$(FL_TURN_HOST)"
    INFOPLIST_KEY_UIFileSharingEnabled: NO
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: NO
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
    GCC_PREPROCESSOR_DEFINITIONS: "$(inherited)"
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
    INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
schemes:
  FuckinLockedRelayTests:
    build:
      targets:
        FuckinLocked: all
    test:
      targets:
        - FuckinLockedTests
        - FuckinLockedUITests
      environmentVariables:
        FL_RUN_RELAY_INTEGRATION: "1"
targets:
  FuckinLocked:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - FuckinLockedTests
    sources:
      - path: FuckinLocked
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.fuckinlocked
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": SimulatorTests.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: "Fuckin Locked"
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Microphone access is required for encrypted voice calls."
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan invitation and device pairing QR codes."
  FuckinLockedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FuckinLockedTests
    dependencies:
      - target: FuckinLocked
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.fuckinlocked.tests
  FuckinLockedUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FuckinLockedUITests
    dependencies:
      - target: FuckinLocked
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.fuckinlocked.uitests
        TEST_TARGET_NAME: FuckinLocked
