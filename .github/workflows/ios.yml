name: iOS build and tests

on:
  push:
    branches: [main, 'work/**']
  workflow_dispatch:
    inputs:
      sign_ipa:
        description: "Sign an Ad Hoc IPA using repository secrets"
        type: boolean
        default: false

jobs:
  diagnose-lifecycle:
    runs-on: macos-26
    steps:
      - name: Locate previous lifecycle failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40132216165 --repo "$GITHUB_REPOSITORY" \
            --name fuckin-locked-simulator-results --dir "$RUNNER_TEMP/previous.xcresult"
          xcrun xcresulttool get object --legacy --format json --path "$RUNNER_TEMP/previous.xcresult" \
            | jq '.issues.testFailureSummaries._values[] | {message: .message._value, location: .documentLocationInCreatingWorkspace.url._value}'
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available
          brew install xcodegen cocoapods
      - name: Generate project and install libsignal
        working-directory: ios
        run: |
          xcodegen generate
          pod install
      - name: Start local HTTPS relay integration fixture
        run: |
          python3 -m venv "$RUNNER_TEMP/fuckin-locked-venv"
          "$RUNNER_TEMP/fuckin-locked-venv/bin/pip" install --disable-pip-version-check -q -r server/requirements.txt
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/fuckin-locked-relay.key" \
            -out "$RUNNER_TEMP/fuckin-locked-relay.crt" \
            -subj '/CN=127.0.0.1' \
            -addext 'subjectAltName=IP:127.0.0.1' >/dev/null 2>&1
          export FL_DB="$RUNNER_TEMP/fuckin-locked-relay.sqlite3"
          export FL_PORT=8787
          export FL_BOOTSTRAP_TOKEN=ci-bootstrap-token
          export FL_METADATA_KEY="$($RUNNER_TEMP/fuckin-locked-venv/bin/python -c 'import base64,os; print(base64.b64encode(os.urandom(32)).decode())')"
          export FL_TEST_TLS_CERT="$RUNNER_TEMP/fuckin-locked-relay.crt"
          export FL_TEST_TLS_KEY="$RUNNER_TEMP/fuckin-locked-relay.key"
          "$RUNNER_TEMP/fuckin-locked-venv/bin/python" server/test_https.py >"$RUNNER_TEMP/fuckin-locked-relay.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/fuckin-locked-relay.pid"
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --insecure --fail https://127.0.0.1:8787/fuckin-locked/health -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/fuckin-locked-relay.log"
          exit 1
      - name: Build and test protocol and vault on simulator
        timeout-minutes: 12
        working-directory: ios
        run: |
          export FL_RUN_RELAY_INTEGRATION=1
          xcodebuild test \
            -workspace FuckinLocked.xcworkspace \
            -scheme FuckinLockedRelayTests \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -derivedDataPath "$RUNNER_TEMP/fuckin-locked-simulator-build" \
            -resultBundlePath "$RUNNER_TEMP/FuckinLockedTests.xcresult" \
            -only-testing:FuckinLockedTests \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            -quiet
      - name: Verify simulator lifecycle
        timeout-minutes: 10
        working-directory: ios
        run: |
          xcodebuild test \
            -workspace FuckinLocked.xcworkspace \
            -scheme FuckinLockedRelayTests \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -derivedDataPath "$RUNNER_TEMP/fuckin-locked-simulator-build" \
            -resultBundlePath "$RUNNER_TEMP/FuckinLockedLifecycle.xcresult" \
            -only-testing:FuckinLockedUITests \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- -quiet
      - name: Upload simulator test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuckin-locked-simulator-results
          path: ${{ runner.temp }}/FuckinLockedTests.xcresult
      - name: Upload lifecycle test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuckin-locked-lifecycle-results
          path: ${{ runner.temp }}/FuckinLockedLifecycle.xcresult
      - name: Report simulator failures
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/FuckinLockedTests.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/FuckinLockedTests.xcresult"
          fi
          if [ -d "$RUNNER_TEMP/FuckinLockedLifecycle.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/FuckinLockedLifecycle.xcresult"
          fi
          cat "$RUNNER_TEMP/fuckin-locked-relay.log"
          simulator_app="$RUNNER_TEMP/fuckin-locked-simulator-build/Build/Products/Debug-iphonesimulator/FuckinLocked.app"
          if [ -d "$simulator_app" ]; then
            codesign -d --entitlements :- "$simulator_app"
          fi
      - name: Stop local HTTPS relay integration fixture
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/fuckin-locked-relay.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/fuckin-locked-relay.pid")" || true
          fi
      - name: Build unsigned iPhone IPA artifact
        if: always()
        run: |
          build_dir="$RUNNER_TEMP/fuckin-locked-iphone-build"
          xcodebuild build \
            -workspace ios/FuckinLocked.xcworkspace \
            -scheme FuckinLocked \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$build_dir" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -quiet
          mkdir -p "$RUNNER_TEMP/fuckin-locked-ipa/Payload"
          cp -R "$build_dir/FuckinLocked.app" "$RUNNER_TEMP/fuckin-locked-ipa/Payload/"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/fuckin-locked-ipa/Payload" \
            "$RUNNER_TEMP/fuckin-locked-unsigned.ipa"
      - name: Upload unsigned iPhone IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuckin-locked-unsigned-ipa
          path: ${{ runner.temp }}/fuckin-locked-unsigned.ipa
          if-no-files-found: error
      - name: Sign iPhone IPA with supplied Ad Hoc profile
        if: github.event_name == 'workflow_dispatch' && inputs.sign_ipa
        env:
          IOS_CERT_P12_B64: ${{ secrets.IOS_CERT_P12_B64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_B64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          signing_dir="$RUNNER_TEMP/fuckin-locked-signing"
          mkdir -p "$signing_dir" "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$IOS_CERT_P12_B64" | base64 -D >"$signing_dir/certificate.p12"
          printf '%s' "$IOS_PROVISION_PROFILE_B64" | base64 -D >"$signing_dir/profile.mobileprovision"
          chmod 600 "$signing_dir"/*

          security cms -D -i "$signing_dir/profile.mobileprovision" >"$signing_dir/profile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$signing_dir/profile.plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$signing_dir/profile.plist")
          profile_team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$signing_dir/profile.plist")
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$signing_dir/profile.plist")
          bundle_id="${bundle_id#*.}"
          test "$profile_team" = "$APPLE_TEAM_ID"
          cp "$signing_dir/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"

          keychain="$signing_dir/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/certificate.p12" -k "$keychain" -P "$IOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          signing_identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(.*\)"/\1/p' | head -1)
          test -n "$signing_identity"

          archive="$RUNNER_TEMP/fuckin-locked-signed.xcarchive"
          xcodebuild archive \
            -workspace ios/FuckinLocked.xcworkspace \
            -scheme FuckinLocked \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$archive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$signing_identity" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$bundle_id" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            PROVISIONING_PROFILE_SPECIFIER="$profile_name" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            -quiet

          cat >"$signing_dir/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>ad-hoc</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>$APPLE_TEAM_ID</string>
          <key>provisioningProfiles</key><dict><key>$bundle_id</key><string>$profile_name</string></dict>
          </dict></plist>
          EOF
          mkdir -p "$RUNNER_TEMP/fuckin-locked-signed-export"
          xcodebuild -exportArchive \
            -archivePath "$archive" \
            -exportPath "$RUNNER_TEMP/fuckin-locked-signed-export" \
            -exportOptionsPlist "$signing_dir/exportOptions.plist" \
            -quiet
      - name: Upload signed iPhone IPA artifact
        if: github.event_name == 'workflow_dispatch' && inputs.sign_ipa
        uses: actions/upload-artifact@v4
        with:
          name: fuckin-locked-signed-ipa
          path: ${{ runner.temp }}/fuckin-locked-signed-export/*.ipa
          if-no-files-found: error
